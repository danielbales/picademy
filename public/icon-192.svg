<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="192" height="192">
  <rect width="200" height="200" rx="40" fill="#0A0B0D"/>
  <g transform="translate(100,100) rotate(-8) translate(-50,-50)">
    <!-- Outer frame -->
    <rect x="8" y="8" width="84" height="84" rx="4" fill="#B8922E"/>
    <!-- Frame face -->
    <rect x="12" y="12" width="76" height="76" rx="3" fill="#D4A843"/>
    <!-- Inner bevel -->
    <rect x="18" y="18" width="64" height="64" rx="2.5" fill="#B8922E"/>
    <!-- Mat -->
    <rect x="21" y="21" width="58" height="58" rx="2" fill="#EDE6D6"/>
    <!-- Dark opening -->
    <rect x="26" y="26" width="48" height="48" rx="2" fill="#0A0B0D"/>
    <!-- Corner rosettes -->
    <circle cx="16" cy="16" r="5.5" fill="#E8C84A"/>
    <circle cx="84" cy="16" r="5.5" fill="#E8C84A"/>
    <circle cx="16" cy="84" r="5.5" fill="#E8C84A"/>
    <circle cx="84" cy="84" r="5.5" fill="#E8C84A"/>
    <circle cx="16" cy="16" r="2.5" fill="#D4A843"/>
    <circle cx="84" cy="16" r="2.5" fill="#D4A843"/>
    <circle cx="16" cy="84" r="2.5" fill="#D4A843"/>
    <circle cx="84" cy="84" r="2.5" fill="#D4A843"/>
    <!-- Big cartoon eyes -->
    <ellipse cx="40" cy="44" rx="7" ry="8" fill="#FFFFFF"/>
    <ellipse cx="60" cy="44" rx="7" ry="8" fill="#FFFFFF"/>
    <ellipse cx="41" cy="45" rx="4.5" ry="5.5" fill="#1A1A2E"/>
    <ellipse cx="61" cy="45" rx="4.5" ry="5.5" fill="#1A1A2E"/>
    <circle cx="43" cy="42" r="2" fill="#FFFFFF"/>
    <circle cx="63" cy="42" r="2" fill="#FFFFFF"/>
    <!-- Raised left eyebrow -->
    <path d="M32 33 Q40 28 48 34" fill="none" stroke="#D4A843" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Normal right eyebrow -->
    <path d="M53 34 Q60 30 68 34" fill="none" stroke="#D4A843" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Cheeky grin -->
    <path d="M38 58 Q50 68 62 58" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Tongue sticking out -->
    <ellipse cx="53" cy="62" rx="4" ry="3" fill="#E8607A"/>
  </g>
  <!-- Sparkle top-right -->
  <path d="M168 28 L172 38 L182 42 L172 46 L168 56 L164 46 L154 42 L164 38Z" fill="#E8C84A" opacity="0.9"/>
  <!-- Small sparkle -->
  <path d="M152 18 L154 23 L159 25 L154 27 L152 32 L150 27 L145 25 L150 23Z" fill="#E8C84A" opacity="0.6"/>
</svg>
